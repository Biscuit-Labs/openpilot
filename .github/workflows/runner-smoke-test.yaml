name: runner-smoke-test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-smoke-test.yaml'

jobs:
  smoke:
    runs-on: [self-hosted, ubuntu-24.04]
    steps:
      - name: Machine info
        run: |
          echo "hostname : $(hostname)"
          echo "kernel   : $(uname -srmo)"
          echo "runner   : $RUNNER_OS / $RUNNER_ARCH"
          echo "shell    : $SHELL"
