name: runner-smoke-test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runner-smoke-test.yaml'

jobs:
  smoke:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-24.04' || 'self-hosted' }}
    steps:
      - name: Machine info
        run: |
          echo "hostname : $(hostname)"
          echo "kernel   : $(uname -srmo)"
          echo "runner   : $RUNNER_OS / $RUNNER_ARCH"
          echo "shell    : $SHELL"
      - name: Git environment check
        run: |
          echo "PATH      : $PATH"
          echo "which git : $(command -v git)"
          git --version
          echo "exec-path : $(git --exec-path)"
      - name: Toolchain check
        run: |
          echo "gcc   : $(gcc --version 2>&1 | head -1)"
          echo "g++   : $(g++ --version 2>&1 | head -1)"
          echo "make  : $(make --version 2>&1 | head -1)"
          echo "go    : $(go version 2>&1)"
          echo "uv    : $(uv --version 2>&1)"
          echo "scons : $(scons --version 2>&1 | sed -n 2p)"
      - name: Checkout (proves actions/checkout works with local git)
        uses: actions/checkout@v7
